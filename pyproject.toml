[project]
name = "faers-signal-pipeline"
version = "0.1.0"
description = "Public pharmacovigilance data platform: FAERS ETL, Temporal orchestration, PostgreSQL 16 + pgvector, PRR/ROR signal statistics behind a CI quality gate."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.9",
    "pydantic>=2.9",
    "pandera>=0.20",
    "psycopg[binary]>=3.2",
    "temporalio>=1.7",
]

[project.optional-dependencies]
# Real embedding model (bge-small-en-v1.5). Deliberately optional: torch
# is heavy and tests never need it — the stub embedder covers CI.
# Intel-Mac pins: PyTorch dropped macOS x86_64 after 2.2.x, and torch 2.2
# predates numpy 2 — constraints scoped to that platform only. The 2.2.x
# wheels stop at CPython 3.12, hence the committed .python-version. The
# ST<4 / transformers<5 pins keep the stack era-coherent with torch 2.2.
vectors = [
    "sentence-transformers>=3.0",
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers<4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
# Split resolution so the Intel-Mac pins above stay CONFINED to that
# platform: without the fork, the resolver unifies and drags the base
# environment's numpy/torch down everywhere.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine != 'x86_64'",
    "sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # Bounded retry for EXACTLY ONE timing-sensitive Temporal test (see
    # the flaky marker in tests/test_workflows.py); everything else runs
    # zero-retry.
    "pytest-rerunfailures>=14",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faers_signal_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit (security)
    "C4",        # comprehensions
    "DTZ",       # naive-datetime bans (determinism)
    "T20",       # no stray print in library code
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]      # assert is the point of tests
"scripts/**" = ["T20"]     # CLI scripts may print

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts", "tests"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Optional extra (vectors); imported lazily, no stubs published.
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov=scripts --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
